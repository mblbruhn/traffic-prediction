[project]
name = "traffic-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lightning>=2.6.5",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pyrefly>=1.2.0",
    "pytorch-geometric>=0.0.2",
    "seaborn>=0.13.2",
    "tables>=3.11.1",
    "torch>=2.14.0",
]

[project.scripts]
traffic-prediction = "traffic_prediction:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
